<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Nave - Parallax e Tiros</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            background: #05051a;
            border: 1px solid #444;
        }
    </style>
</head>

<body>
    <canvas id="game" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const W = canvas.width, H = canvas.height;

        // ---------- Teclado ----------
        const keys = {};
        addEventListener("keydown", e => {
            keys[e.code] = true;
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
        });
        addEventListener("keyup", e => keys[e.code] = false);

        const layers = [
            { speed: 40, count: 60, size: 1, color: "#555" },   // estrelas distantes (lenta)
            { speed: 100, count: 40, size: 2, color: "#aaa" },   // intermediárias
            { speed: 220, count: 20, size: 3, color: "#fff" }    // próximas (rápida)
        ].map(l => ({
            ...l,
            stars: Array.from({ length: l.count }, () => ({ x: Math.random() * W, y: Math.random() * H }))
        }));

        function updateParallax(dt) {
            for (const l of layers)
                for (const s of l.stars) {
                    s.y += l.speed * dt;
                    if (s.y > H) { s.y = -l.size; s.x = Math.random() * W; }
                }
        }
        function drawParallax() {
            for (const l of layers) {
                ctx.fillStyle = l.color;
                for (const s of l.stars) ctx.fillRect(s.x, s.y, l.size, l.size);
            }
        }

        const ship = { x: W / 2, y: H - 80, w: 36, h: 36, speed: 300 };

        function updateShip(dt) {
            let dx = 0, dy = 0;
            if (keys.ArrowLeft || keys.KeyA) dx -= 1;
            if (keys.ArrowRight || keys.KeyD) dx += 1;
            if (keys.ArrowUp || keys.KeyW) dy -= 1;
            if (keys.ArrowDown || keys.KeyS) dy += 1;
            const len = Math.hypot(dx, dy) || 1;
            ship.x += (dx / len) * ship.speed * dt;
            ship.y += (dy / len) * ship.speed * dt;
            ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
            ship.y = Math.max(ship.h / 2, Math.min(H - ship.h / 2, ship.y));
        }
        function drawShip() {
            ctx.fillStyle = "#4fc3f7";
            ctx.beginPath();
            ctx.moveTo(ship.x, ship.y - ship.h / 2);
            ctx.lineTo(ship.x + ship.w / 2, ship.y + ship.h / 2);
            ctx.lineTo(ship.x, ship.y + ship.h / 4);
            ctx.lineTo(ship.x - ship.w / 2, ship.y + ship.h / 2);
            ctx.closePath();
            ctx.fill();
        }

        const bullets = [];
        const BULLET_SPEED = 500;
        const FIRE_DELAY = 0.15;
        let cooldown = 0;

        function getShotDirection() {
            let dx = 0, dy = 0;
            if (keys.ArrowUp || keys.KeyW) dy -= 1;
            if (dx === 0 && dy === 0) dy = -1;
            const len = Math.hypot(dx, dy);
            return { dx: dx / len, dy: dy / len };
        }

        function updateBullets(dt) {
            cooldown -= dt;
            if (keys.Space && cooldown <= 0) {
                const d = getShotDirection();
                bullets.push({ x: ship.x, y: ship.y, vx: d.dx * BULLET_SPEED, vy: d.dy * BULLET_SPEED });
                cooldown = FIRE_DELAY;
            }
            for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) bullets.splice(i, 1);
            }
        }
        function drawBullets() {
            ctx.fillStyle = "#ffeb3b";
            for (const b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawHUD() {
            ctx.fillStyle = "#ccc";
            ctx.font = "14px monospace";
            ctx.fillText("Setas/WASD: mover e mirar | Espaço: atirar (sem seta = frente)", 10, 20);
        }

        let last = performance.now();
        function loop(now) {
            const dt = Math.min((now - last) / 1000, 0.05);
            last = now;

            updateParallax(dt);
            updateShip(dt);
            updateBullets(dt);

            ctx.clearRect(0, 0, W, H);
            drawParallax();
            drawBullets();
            drawShip();
            drawHUD();

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>

</html>
